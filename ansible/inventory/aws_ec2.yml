plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  tag:Name:
    - expense-tracker-frontend-*
    - expense-tracker-backend-*

hostnames:
  - instance-id


groups:
  frontend: "'frontend' in ec2_tags.Name"
  backend: "'backend' in ec2_tags.Name"

compose:
  ansible_connection: "'aws_ssm'"
  ansible_aws_ssm_region: "'ap-south-1'"
  ansible_aws_ssm_bucket_name: "'expense-tracker-ansible-ssm-yd2026'"